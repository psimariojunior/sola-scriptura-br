name: Backend Deploy

on:
  push:
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test
        working-directory: backend

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.131.184.53
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "backend/"
          target: "/opt/sola-scriptura/"
      - name: Build and restart on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.131.184.53
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /opt/sola-scriptura/backend
            docker compose down
            docker compose up -d --build
