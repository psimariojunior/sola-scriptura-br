name: sola_scriptura_app
description: "Sola Scriptura BR — Estudo Bíblico Completo"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.4.0
  webview_flutter_wkwebview: ^3.16.0
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  firebase_crashlytics: ^4.3.1
  firebase_analytics: ^11.4.1
  http: ^1.2.0
  home_widget: ^0.7.0
  timezone: ^0.10.0
  background_fetch: ^1.3.7
  sqflite: ^2.3.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A0908"
  adaptive_icon_foreground: "assets/app_icon.png"
